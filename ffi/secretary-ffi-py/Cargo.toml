[package]
name = "secretary-ffi-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for secretary-core. Exposes vault unlock and the UnlockedIdentity handle; full per-platform bindings live downstream."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
secretary-core = { path = "../../core" }
secretary-ffi-bridge = { path = "../secretary-ffi-bridge" }
pyo3 = { version = "0.29" }
zeroize = "=1.8.2"

# Crate-local lint table replacing the inherited workspace `unsafe_code = "forbid"`.
# PyO3's #[pymodule] / #[pyfunction] macros expand to user-crate code containing
# unsafe blocks (the CPython C-API bridge is inherently unsafe). `forbid` is
# non-overridable by inner #[allow], so this crate downgrades to `deny` and the
# lib.rs `#![allow(unsafe_code)]` covers the macro expansions. The workspace
# only sets `unsafe_code = "forbid"` today (no clippy / rustdoc lint tables),
# so this single line is the entire crate-local table.
# Decision: docs/superpowers/specs/2026-05-03-ffi-b1-py-bindings-boilerplate-design.md
[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
# `test-support` gives these tests `Detail::for_test`, the only way to build a
# `Detail` outside the bridge's own `detail.rs` (#500/#504). The crate is
# already a normal dependency above; this re-declaration adds the feature on
# the DEV edge only, which under resolver v2 keeps the hatch out of `cargo
# build --release`. `scripts/check-test-support-placement.py` enforces that
# placement.
secretary-ffi-bridge = { path = "../secretary-ffi-bridge", features = ["test-support"] }
