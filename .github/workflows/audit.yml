name: Dependency audit

# RustSec advisory gate for a project that holds real user secrets (#354).
# CodeQL's default setup covers static analysis only — it does NOT scan the
# Rust dependency graph for advisories, and the committed exact `Cargo.lock`
# means transitives never move without a human. This job closes that gap.
#
# `cargo audit --deny warnings` fails on ANY advisory (vulnerability,
# unmaintained, or unsound). The advisories we have consciously accepted are
# listed — with rationale — in `.cargo/audit.toml`; adding to that list is a
# deliberate risk decision. `cargo audit` only reads `Cargo.lock`, so this job
# needs no Tauri/GTK system libs and runs ubuntu-only and fast.

on:
  push:
    branches: [main]
    paths: ['**/Cargo.toml', 'Cargo.lock', '.cargo/audit.toml', '.github/workflows/audit.yml']
  pull_request:
    paths: ['**/Cargo.toml', 'Cargo.lock', '.cargo/audit.toml', '.github/workflows/audit.yml']
  schedule:
    # Weekly — catches newly-published advisories against unchanged pinned deps.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      alert_on_failure:
        # Lets a manual run exercise the same alert path a scheduled run takes.
        description: 'Open/comment on the audit issue if this run fails'
        type: boolean
        default: false

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # Lower than the build jobs' 30: the dominant cost is a cold
    # `cargo install cargo-audit` (~3-5min, near-instant once rust-cache warms).
    # Provisional runaway cap (vs the 6h default); a clip fails loud (#427).
    timeout-minutes: 15
    steps:
      - name: TEMP inject failure (dry run for #707, reverted)
        run: exit 1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-audit
        # --locked pins cargo-audit's own transitives; the compile is cached
        # across runs by rust-cache. Kept in the caret range so patch/minor
        # advisory-format fixes land without a manual bump.
        run: cargo install --locked cargo-audit
      - name: Audit dependencies (deny all advisories not in .cargo/audit.toml)
        run: cargo audit --deny warnings

  # A red scheduled run gates no PR and is not a required check, so without
  # this it alerts nobody: RUSTSEC-2026-0385 sat red on main for two weekly
  # runs (#707). Push/PR runs are not alerted — their author already sees them.
  # A separate job so `issues: write` never reaches the job running cargo.
  alert:
    name: alert on failed scheduled audit
    needs: cargo-audit
    if: failure() && (github.event_name == 'schedule' || inputs.alert_on_failure)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the audit issue
        # Idempotent: one open `audit` issue collects every failed run; a new
        # one is opened only once the previous one is closed. Assigning the
        # owner is what guarantees a notification.
        run: |
          set -euo pipefail
          existing=$(gh issue list --label audit --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Dependency audit failed again: $RUN_URL"
          else
            gh label create audit --color B60205 \
              --description 'Failed scheduled cargo audit (audit.yml)' --force
            gh issue create --label audit --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title '[audit] Scheduled cargo audit failed on main' \
              --body "The \`Dependency audit\` workflow failed: $RUN_URL

          Fix the advisory (or accept it with rationale in \`.cargo/audit.toml\`), then close this issue. Later failures comment here while it stays open."
          fi
